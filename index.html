<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Drift Among the Stars: star map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Theme tokens (light default, dark via media query or data-theme) ---------- */
:root {
  color-scheme: light;
  --space: #1a2030;            /* map background in light viewers: lifted, still dark so glows read */
  --panel-bg: rgba(244, 246, 250, 0.94);
  --panel-line: rgba(30, 40, 60, 0.14);
  --ink: #131a27;
  --ink-2: #485469;
  --ink-3: #6f7a8e;
  --chip-off: rgba(244, 246, 250, 0.55);
  --hover: rgba(20, 30, 50, 0.07);
  --focus: #2f6fd6;
  --label-ink: #e6ecf6;
  --label-shadow: rgba(4, 6, 12, 0.95);
  --danger: #d9553b;
  --menu-bg: #f4f6fa;
  --font: "Saira Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --space: #05070d;
    --panel-bg: rgba(13, 18, 29, 0.9);
    --panel-line: rgba(160, 180, 215, 0.16);
    --ink: #e3e9f3;
    --ink-2: #9aa6bb;
    --ink-3: #6b7790;
    --chip-off: rgba(13, 18, 29, 0.5);
    --hover: rgba(160, 180, 215, 0.09);
    --focus: #8fbaff;
    --danger: #ff7a5c;
    --menu-bg: #121a28;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --space: #05070d;
  --panel-bg: rgba(13, 18, 29, 0.9);
  --panel-line: rgba(160, 180, 215, 0.16);
  --ink: #e3e9f3;
  --ink-2: #9aa6bb;
  --ink-3: #6b7790;
  --chip-off: rgba(13, 18, 29, 0.5);
  --hover: rgba(160, 180, 215, 0.09);
  --focus: #8fbaff;
  --danger: #ff7a5c;
  --menu-bg: #121a28;
}

:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--space);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.4;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

/* ---------- Star labels ---------- */
.label {
  position: absolute; left: 0; top: 0;
  pointer-events: auto;
  background: none; border: 0; padding: 1px 3px; margin: 0;
  color: var(--label-ink);
  font-size: 13px; font-weight: 500; letter-spacing: 0.01em;
  white-space: nowrap; cursor: pointer;
  text-shadow: 0 0 3px var(--label-shadow), 0 0 8px var(--label-shadow);
  will-change: transform;
}
.label.is-capital { font-size: 14.5px; font-weight: 600; }
.label.is-dead { color: #9ba3b2; font-style: italic; }
.label.is-hidden { visibility: hidden; }
.label.is-selected { color: #fff; }
.region {
  position: absolute; left: 0; top: 0; pointer-events: none;
  font-size: 15px; font-weight: 500; letter-spacing: 0.02em; white-space: nowrap; opacity: 0.85;
  text-shadow: 0 0 3px var(--label-shadow), 0 0 8px var(--label-shadow);
}
.region.is-hidden { visibility: hidden; }
.label .dash { display: inline-block; width: 8px; height: 1px; vertical-align: middle; margin-right: 4px; opacity: 0.8; }

/* ---------- Overlay chrome ---------- */
.ui { position: fixed; z-index: 2; }
.surface {
  background: var(--panel-bg);
  border: 1px solid var(--panel-line);
  border-radius: 10px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}

.top {
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: calc(env(safe-area-inset-left, 0px) + 14px);
  width: min(360px, calc(100vw - 28px));
  display: flex; flex-direction: column; gap: 8px;
}
.titlebar { padding: 10px 12px 10px 14px; }
h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: 0.005em; line-height: 1.2; }
.subtitle { margin: 2px 0 8px; color: var(--ink-2); font-size: 13.5px; }

.search { position: relative; }
.search input {
  width: 100%; height: 36px; padding: 0 10px 0 32px;
  background: var(--hover); border: 1px solid var(--panel-line); border-radius: 7px;
  font-size: 15px;
}
.search input::placeholder { color: var(--ink-3); }
.search svg { position: absolute; left: 10px; top: 11px; width: 14px; height: 14px; stroke: var(--ink-3); fill: none; stroke-width: 2; }
.results { list-style: none; margin: 6px 0 0; padding: 4px; }
.results[hidden] { display: none; }
.results li button {
  width: 100%; text-align: left; background: none; border: 0; border-radius: 6px;
  padding: 6px 8px; cursor: pointer; display: flex; align-items: center; gap: 8px;
}
.results li button:hover, .results li button.is-active { background: var(--hover); }
.results .sub { color: var(--ink-2); font-size: 13px; }
.results .empty { padding: 6px 8px; color: var(--ink-2); font-size: 13.5px; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 11px 0 9px;
  background: var(--panel-bg); border: 1px solid var(--panel-line); border-radius: 15px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  font-size: 13.5px; cursor: pointer; white-space: nowrap;
}
.chip[aria-pressed="false"] { background: var(--chip-off); color: var(--ink-3); }
.chip[aria-pressed="false"] .swatch { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(10, 16, 28, 0.35); }
.swatch.diamond { border-radius: 1px; transform: rotate(45deg) scale(0.85); }

/* ---------- Bottom bar ---------- */
.bottom {
  left: calc(env(safe-area-inset-left, 0px) + 14px);
  right: calc(env(safe-area-inset-right, 0px) + 14px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  pointer-events: none;
}
.bottom > * { pointer-events: auto; }
.scale { padding: 7px 12px 8px; font-size: 13px; color: var(--ink-2); }
.scale .bar { height: 6px; border: 1.5px solid var(--ink); border-top: 0; margin-bottom: 4px; transition: width 120ms linear; }
.controls { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; justify-content: flex-end; }
.travel { padding: 4px; }
.travel .caption { padding: 4px 6px 5px; font-size: 12.5px; color: var(--ink-2); max-width: 300px; }
.travel .caption.is-danger { color: var(--danger); }
.origin { display: flex; align-items: center; gap: 8px; padding: 4px 4px 6px 6px; font-size: 13.5px; }
.origin[hidden] { display: none; }
.origin label { color: var(--ink-2); min-width: 2.2em; }
.travel .caption strong { color: var(--ink); font-weight: 600; }
.origin select {
  flex: 1; min-width: 0; height: 32px; padding: 0 8px; border-radius: 6px;
  background: var(--hover); border: 1px solid var(--panel-line); font-size: 14px;
}
.origin select option, .origin select optgroup { background: var(--menu-bg); color: var(--ink); }
.origin.is-asking select { outline: 2px solid var(--focus); outline-offset: 1px; }
.label.is-far { opacity: 0.4; }
.label.is-ship { color: #ffe9b0; font-size: 12.5px; font-style: italic; }
.panel .star-line { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
.panel .ships button { font-style: italic; }
.seg { display: flex; gap: 2px; }
.seg button {
  height: 30px; padding: 0 11px; border: 0; border-radius: 6px; background: none; cursor: pointer; font-size: 13.5px; color: var(--ink-2);
}
.seg button:hover { background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel-bg); }
.btn {
  height: 40px; padding: 0 14px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 7px;
}
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ---------- System panel ---------- */
.panel {
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: calc(env(safe-area-inset-right, 0px) + 14px);
  max-height: calc(100vh - 200px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  width: 340px; max-width: calc(100vw - 28px);
  z-index: 3; display: flex; flex-direction: column; overflow: hidden;
}
.panel[hidden] { display: none; }
.panel-head { padding: 14px 14px 12px 16px; border-bottom: 1px solid var(--panel-line); display: flex; gap: 10px; align-items: flex-start; }
.panel-head .titles { flex: 1; min-width: 0; }
.panel h2 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.15; }
.panel .faction-line { display: flex; align-items: center; gap: 7px; margin-top: 4px; color: var(--ink-2); font-size: 14px; }
.close { width: 34px; height: 34px; border: 0; border-radius: 8px; background: none; cursor: pointer; flex: none; display: grid; place-items: center; }
.close:hover { background: var(--hover); }
.close svg { width: 16px; height: 16px; stroke: var(--ink-2); stroke-width: 2; }
.panel-body { padding: 4px 16px 16px; overflow-y: auto; }
.panel h3 { margin: 16px 0 6px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.panel .note { margin: 12px 0 0; font-size: 15px; line-height: 1.5; }
.panel .meta { margin: 8px 0 0; color: var(--ink-3); font-size: 13px; }
.planets { list-style: none; margin: 0; padding: 0; }
.planets li { padding: 8px 0; border-top: 1px solid var(--panel-line); }
.planets li:first-child { border-top: 0; }
.planets .pname { font-weight: 600; font-size: 15px; }
.planets .pnote { color: var(--ink-2); font-size: 14px; line-height: 1.45; margin-top: 1px; }
.neighbours { display: flex; flex-wrap: wrap; gap: 6px; }
.neighbours button {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 8px;
  border: 1px solid var(--panel-line); border-radius: 15px; background: none; cursor: pointer; font-size: 13.5px;
}
.neighbours button:hover { background: var(--hover); }
.neighbours .d { color: var(--ink-3); }

/* ---------- Narrow screens: panel becomes a bottom sheet ---------- */
@media (max-width: 720px) {
  h1 { font-size: 17px; }
  .subtitle { display: none; }
  .titlebar { padding: 8px 10px; }
  .top { width: calc(100vw - 28px); }
  .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .filters::-webkit-scrollbar { display: none; }
  .panel {
    top: auto; left: calc(env(safe-area-inset-left, 0px) + 8px); right: calc(env(safe-area-inset-right, 0px) + 8px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    width: auto; max-width: none; max-height: 52%;
  }
  .travel .caption { font-size: 12px; max-width: 230px; }
  .btn .txt { display: none; }
  .btn { width: 40px; padding: 0; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  .scale .bar { transition: none; }
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.error { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--label-ink); z-index: 9; }
</style>
</head>
<body>

<canvas id="scene" aria-label="3D star map. Drag to rotate, pinch or scroll to zoom, two fingers or right-drag to pan."></canvas>
<div id="labels" aria-hidden="false"></div>

<div class="ui top">
  <div class="surface titlebar">
    <h1>The Drift Among the Stars</h1>
    <p class="subtitle">Political map of the cluster. Tap a star for details.</p>
    <div class="search" role="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <label class="sr-only" for="q">Search systems and planets</label>
      <input id="q" type="search" placeholder="Search systems or planets" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
      <ul id="results" class="results" role="listbox" hidden></ul>
    </div>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Show or hide factions"></div>
</div>

<aside class="ui panel surface" id="panel" hidden aria-live="polite">
  <div class="panel-head">
    <div class="titles">
      <h2 id="p-name"></h2>
      <div class="faction-line"><span class="swatch" id="p-swatch"></span><span id="p-faction"></span></div>
    </div>
    <button class="close" id="p-close" aria-label="Close system details">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg>
    </button>
  </div>
  <div class="panel-body" id="p-body"></div>
</aside>

<div class="ui bottom">
  <div class="surface scale" aria-label="Scale">
    <div class="bar" id="scale-bar" style="width:80px"></div>
    <span id="scale-text">1 light year</span>
  </div>
  <div class="controls">
    <div class="surface travel">
      <div class="origin" id="origin-row" hidden>
        <label for="origin">From</label>
        <select id="origin"><option value="">Choose a system</option></select>
      </div>
      <div class="origin" id="dest-row" hidden>
        <label for="dest">To</label>
        <select id="dest"><option value="">Choose a system</option></select>
      </div>
      <div class="seg" role="group" aria-label="Connection lines">
        <button data-mode="adjacency" aria-pressed="true">Borders</button>
        <button data-mode="jump" aria-pressed="false">Jump</button>
        <button data-mode="warp" aria-pressed="false">Warp</button>
        <button data-mode="crs" aria-pressed="false">CRS</button>
      </div>
      <div class="caption" id="travel-caption"></div>
    </div>
    <button class="surface btn" id="reset" aria-label="Reset view">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9"/><path d="M2.5 2.5v3h3"/></svg>
      <span class="txt">Reset view</span>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =====================================================================================
   MAP DATA — edit here.
   -------------------------------------------------------------------------------------
   One object per system. To MOVE a system, edit its `position` line.
   To ADD a system, copy a block, change the name, and list it in `adjacent`.
   Units are light years. +y is "up" out of the cluster plane; the faint rings sit at y = 0.
   Hestia sits at the origin.

   Fields
     name      unique system name (used by `adjacent`). Filler stars use null.
     faction   "CSP" | "SIS" | "EMP" | "FED" | "DRIFT" | "NONE"   (see FACTIONS below)
     status    "settled" | "dead" | "unclaimed" | "special"
     position  { x, y, z } in light years
     planets   [ { name, note } ]   planet, station or belt descriptions
     adjacent  [ system names ]     (one side is enough; links are made both ways)
     star      what kind of star it is (shown in the panel)
     note      system description shown in the panel
     capital   optional; true makes the label larger and keeps it visible first

   Neighbouring systems sit about 5 ly apart (4–6 ly); the Three Sisters are packed within a light year.
   ALL coordinates are PLACEHOLDERS (invented to fit the layout rules) unless marked otherwise.
   Planet names outside the Federation and the homeworld systems are working names.
   ===================================================================================== */
const SYSTEMS = [
  /* ---------- Human Planetary Federation (remnant) — middle of the cluster ---------- */
  { name: "Hestia", faction: "FED", status: "dead", capital: true,
    position: { x: 0.0, y: 0.0, z: 0.0 },       // PLACEHOLDER
    star: "White dwarf and nebula.",
    note: "The Federation's lost heart. The Cradle, homeworld of stellar humanity, orbited here until the star went nova. Nobody agrees on what happened, and the Federation does not discuss it.",
    planets: [
      { name: "The Cradle", note: "Former homeworld of the Federation, and the world that ran the Reunion. Lost with the star." },
      { name: "Orbital structures", note: "Vast constructions still in close orbit around the remnant dwarf. Their purpose is not public." },
    ],
    adjacent: ["Pomona", "Cardea", "Portunus", "The Drift", "Janus", "Forculus", "Fontus", "Fornax", "Lucina", "Pales", "Consus"] },

  { name: "Pomona", faction: "FED", status: "settled",
    position: { x: -5.3, y: 0.7, z: 0.7 },      // PLACEHOLDER
    star: "Yellow dwarf",
    note: "One of the three systems the Federation still holds, on its border with the Holy Lunar Empire. Current posting of OE Team Orion.",
    planets: [
      { name: "Pomona II", note: "The Federation's breadbasket: an orchard and grain world that feeds Portunus and Cardea. Farmland runs in a long temperate band; beyond the cultivated edge the native ecology is hostile." },
    ],
    adjacent: ["Hestia", "Cardea", "Matins", "Vigil", "Silvanus", "Pales", "Consus"] },

  { name: "Cardea", faction: "FED", status: "settled",
    position: { x: -2.5, y: 0.2, z: 5.4 },      // PLACEHOLDER
    star: "Orange dwarf",
    note: "One of the three systems the Federation still holds, on its border with the Three Sisters. The Sisters do not recognise the Federation, and nothing crosses this border openly.",
    planets: [
      { name: "Cardea III", note: "Cold, mountainous frontier world. Mining towns and walled settlements send metals and water ice to Portunus." },
    ],
    adjacent: ["Hestia", "Pomona", "The Drift", "Portunus", "Erzählung", "Lied"] },

  { name: "Portunus", faction: "FED", status: "settled", capital: true,
    position: { x: 2.6, y: 1.9, z: 4.4 },       // PLACEHOLDER
    star: "Yellow-white star",
    note: "Seat of the Federation remnant and its busiest port, bordering both the Three Sisters and the CSP. DHV Volkov is holding here.",
    planets: [
      { name: "Portunus II", note: "Capital world of what is left of the Federation. Its government, its law courts and its archives sit here, run by people who watched the heartland fall. Crowded, proud and short on industry." },
      { name: "Portunus Harbor", note: "Large orbital station above Portunus II. It keeps the Federation's irreplaceable ships flying and is building the habitat ship Opus." },
    ],
    adjacent: ["Hestia", "Cardea", "The Drift", "Erzählung", "Strophe", "Deucalion", "Oboro"] },

  /* ---------- Dead Federation systems — old Federation space, silent since 120.982. Named for Roman household, pastoral, threshold and harvest gods. ---------- */
  { name: "Janus", faction: "FED", status: "dead",
    position: { x: -3.0, y: 1.4, z: -3.8 },     // PLACEHOLDER
    star: "Red dwarf",
    note: "Former Federation crossroads where the routes to Pomona and the southern frontier once met.",
    planets: [
      { name: "Janus I", note: "Cracked waystation world." },
    ],
    adjacent: ["Hestia", "Silvanus", "Terminus", "Limentinus", "Annona"] },

  { name: "Silvanus", faction: "FED", status: "dead",
    position: { x: -6.6, y: 3.0, z: -2.4 },     // PLACEHOLDER
    star: "Orange dwarf",
    note: "Former Federation forest colony. Cracked apart since 120.982. Nobody holds it now. Empire pilgrims cross it on their way to Pomona.",
    planets: [
      { name: "Silvanus II", note: "Was once a forest world. Currently exists only as a large debris field." },
    ],
    adjacent: ["Pomona", "Janus", "Vigil"] },

  { name: "Terminus", faction: "FED", status: "dead",
    position: { x: -4.8, y: -2.4, z: -6.5 },    // PLACEHOLDER
    star: "Red dwarf",
    note: "For eleven centuries this was where the Federation stopped Empire ships. Silent since 120.982.",
    planets: [
      { name: "Terminus Station", note: "Large system defence fortress in high orbit. Dark, but intact." },
    ],
    adjacent: ["Janus", "Limentinus", "Vigil", "Sext"] },

  { name: "Limentinus", faction: "FED", status: "dead",
    position: { x: -2.5, y: 1.3, z: -8.8 },     // PLACEHOLDER
    star: "Orange dwarf",
    note: "Former Federation border system on the containment line facing the Empire. Silent since 120.982. Nobody holds it now.",
    planets: [
      { name: "Limentinus III", note: "Garrison world with fortified ports. Abandoned." },
    ],
    adjacent: ["Janus", "Terminus", "Annona", "Spes", "Sext"] },

  { name: "Annona", faction: "FED", status: "dead",
    position: { x: 0.9, y: 3.5, z: -6.0 },      // PLACEHOLDER
    star: "Yellow dwarf",
    note: "Former granary system of the Federation heartland. Silent since 120.982.",
    planets: [
      { name: "Annona II", note: "Was once a farm world. No transmissions have been recieved from it since." },
      { name: "Annona IV", note: "Smaller farm world and grain port. Has also fallen silent." },
    ],
    adjacent: ["Janus", "Limentinus", "Forculus", "Fornax", "Spes"] },

  { name: "Forculus", faction: "FED", status: "dead",
    position: { x: 0.5, y: -1.3, z: -5.0 },     // PLACEHOLDER
    star: "Red dwarf",
    note: "Former Federation fleet yard. Wrecks and an unfinished yard are still in orbit, and every power would like to have them. Silent since 120.982.",
    planets: [
      { name: "Forculus Yards", note: "Shipyard complex in orbit around a barren world." },
      { name: "Forculus I", note: "Barren, arid world. Once held several large extraction outposts." },
    ],
    adjacent: ["Hestia", "Annona", "Fontus", "Fornax", "Spes"] },

  { name: "Fontus", faction: "FED", status: "dead",
    position: { x: -3.2, y: -3.2, z: -2.3 },    // PLACEHOLDER
    star: "Red dwarf",
    note: "Former ice-mining system that supplied water to the heartland. Silent since 120.982.",
    planets: [
      { name: "Fontus belt", note: "Ice belt with mining stations and refineries, all dark." },
      { name: "Fontus III", note: "Gas giant that once held multiple gas extraction orbitals. No transmissions have been recieved from them since 120.982." },

  /* ---------- Deep background: distant field stars (parallax) and a far sky sphere ---------- */
  // Seeded random so the sky is the same on every visit.
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  function pointCloud(count, place, size, opacity, color) {
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) { const v = place(); pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z; }
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const pts = new THREE.Points(g, new THREE.PointsMaterial({ color, size, sizeAttenuation: false, transparent: true, opacity, depthWrite: false }));
    pts.renderOrder = -1; scene.add(pts); return pts;
  }
  const randDir = () => { const u = rand() * 2 - 1, t = rand() * Math.PI * 2, s = Math.sqrt(1 - u * u); return new THREE.Vector3(s * Math.cos(t), u, s * Math.sin(t)); };
  // Field stars well outside the cluster: they shift against the map as you orbit, which sells the depth.
  pointCloud(800, () => { const r = 42 + Math.pow(rand(), 0.7) * 220; const d = randDir(); d.y *= 0.55; return d.normalize().multiplyScalar(r); }, 1.6, 0.5, 0xa9b6cf);
  // Far sky with a tilted galactic band.
  const band = new THREE.Euler(0.95, 0, 0.35);
  pointCloud(2600, () => {
    const d = randDir();
    if (rand() < 0.62) { d.y *= 0.09; d.normalize(); d.applyEuler(band); }
    return d.multiplyScalar(1800);

  /* ---------- Reference plane: rings every 5 ly out to 40, bearing spokes, distance labels ---------- */
  const GRID_MAX = 40, GRID_STEP = 5;
  const grid = new THREE.Group();
  for (let r = GRID_STEP; r <= GRID_MAX; r += GRID_STEP) {
    const major = r % 10 === 0;
    const fade = r <= 20 ? 1 : 1 - (r - 20) / 30;
    grid.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(circlePts(0, 0, r, 192)), lineMat(0x8796b3, (major ? 0.15 : 0.07) * fade)));
  }
  const spoke = [];
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    spoke.push(new THREE.Vector3(c * 2.5, 0, s * 2.5), new THREE.Vector3(c * GRID_MAX, 0, s * GRID_MAX));
  }
  grid.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(spoke), lineMat(0x8796b3, 0.05)));
  scene.add(grid);

  // Text on the plane: either lying flat and turning with the view, or standing upright facing the viewer.
  const flatTexts = [];
  function flatText(text, { height, color, opacity, weight = 500, upright = false }) {
    const c = document.createElement("canvas"), g = c.getContext("2d");
    const fontPx = 96;
    const font = `${weight} ${fontPx}px "Saira Semi Condensed", "Arial Narrow", sans-serif`;
    g.font = font;
    const w = Math.ceil(g.measureText(text).width) + 24;
    c.width = w; c.height = fontPx + 32;
    g.font = font; g.fillStyle = "#fff"; g.textBaseline = "middle"; g.textAlign = "center";
    g.fillText(text, w / 2, c.height / 2);

    const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({
      map: tex, color: new THREE.Color(color), transparent: true, opacity, depthWrite: false, depthTest: false, side: THREE.DoubleSide }));
    const worldH = height * c.height / fontPx;

    m.userData.aspect = w / c.height;

  }
  const ringLabels = [10, 20, 30, 40].map(r => ({ r, mesh: flatText(`${r} ly`, { height: 0.7, color: "#8796b3", opacity: r <= 20 ? 0.55 : 0.35 }) }));

  /* ---------- Territory outlines on the plane (wireframe in place of glows) ---------- */
  // Rounded convex hull: hull of small circles around each member system, projected to y = 0.
  function roundedHull(members, pad) {
    const pts = [];
    members.forEach(s => { for (let i = 0; i < 24; i++) { const a = (i / 24) * Math.PI * 2; pts.push([s.v.x + Math.cos(a) * pad, s.v.z + Math.sin(a) * pad]); } });
    pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [], upper = [];
    for (const p of pts) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); }
    for (const p of pts.slice().reverse()) { while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); }
    return lower.slice(0, -1).concat(upper.slice(0, -1));
  }
  function territory(hull, color, { dashed = false, line = 0.55, fill = 0.035 } = {}) {
    const grp = new THREE.Group();
    const loop = hull.map(([x, z]) => new THREE.Vector3(x, 0, z)); loop.push(loop[0].clone());
    const outline = new THREE.Line(new THREE.BufferGeometry().setFromPoints(loop), lineMat(color, line, dashed));
    if (dashed) outline.computeLineDistances();
    grp.add(outline);
    const cx = hull.reduce((a, p) => a + p[0], 0) / hull.length, cz = hull.reduce((a, p) => a + p[1], 0) / hull.length;
    const fan = [];
    for (let i = 0; i < hull.length; i++) { const a = hull[i], b = hull[(i + 1) % hull.length]; fan.push(cx, 0, cz, a[0], 0, a[1], b[0], 0, b[1]); }
    const fg = new THREE.BufferGeometry(); fg.setAttribute("position", new THREE.Float32BufferAttribute(fan, 3));
    grp.add(new THREE.Mesh(fg, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: fill, depthWrite: false, side: THREE.DoubleSide })));

    scene.add(grp);

  }
  const territories = []; // { group, keys: faction keys that must be on for it to show }
  const PAD = TERRITORY.PADDING;
  ["EMP", "CSP", "SIS"].forEach(k => {
    const members = named.filter(s => s.faction === k);
    if (members.length) territories.push({ group: territory(roundedHull(members, k === "SIS" ? PAD * 0.8 : PAD), FACTIONS[k].color), keys: [k] });
  });
  // Old Federation space: every Federation system, living or dead, plus the Drift. Dashed grey.
  const oldFed = named.filter(s => s.faction === "FED" || s.faction === "DRIFT");
  if (oldFed.length) territories.push({ group: territory(roundedHull(oldFed, PAD), 0x8a919e, { dashed: true, line: 0.5, fill: 0.02 }), keys: ["NONE"] });
  // Surviving Federation systems each hold only their own small pocket.
  named.filter(s => s.faction === "FED" && s.status !== "dead").forEach(s =>
    territories.push({ group: territory(roundedHull([s], PAD * 0.75), FACTIONS.FED.color, { line: 0.6, fill: 0.05 }), keys: ["FED"] }));
  // Region names (positions are editable in TERRITORY.LABELS)
  // Region names are HTML so they stay sharp; placeLabels() keeps them on screen and out of the way of star names.
  const regionLabels = TERRITORY.LABELS.map(l => {
    const el = document.createElement("div");
    el.className = "region is-hidden";
    el.textContent = l.text;
    el.style.color = l.key === "NONE" ? "#9aa1ad" : FACTIONS[l.key].color;
    document.getElementById("labels").appendChild(el);
    return { el, v: new THREE.Vector3(l.x, 0, l.z), key: l.key };
  });

  /* ---------- Per-system objects ---------- */
  const STAR_PX = { capital: 10, settled: 8, dead: 7, special: 14, unclaimed: 4.5 };
  SYSTEMS.forEach(s => {
    const f = FACTIONS[s.faction];
    const isDrift = s.status === "special";
    const color = s.status === "dead" ? "#8a919e" : f.color;
    const opacity = s.status === "unclaimed" ? 0.5 : s.status === "dead" ? 0.8 : 1;
    s.dot = new THREE.Sprite(additive(isDrift ? diamondTex : starTex, color, opacity));
    s.dot.position.copy(s.v);
    s.dot.renderOrder = 3;
    s.px = s.capital ? STAR_PX.capital : STAR_PX[s.status];

  // The Drift: Golden Pillar, a thin camera-facing vertical beam
  const drift = named.find(s => s.status === "special");
  let pillar = null;
  if (drift) {
    pillar = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: pillarTex, color: new THREE.Color(FACTIONS.DRIFT.color), transparent: true, opacity: 0.85,
        blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, side: THREE.DoubleSide }));
    pillar.renderOrder = 2;
    scene.add(pillar);
  }
  const PILLAR_HEIGHT = 5; // ly, exaggerated for visibility

  // Selection ring
  const selRing = new THREE.Sprite(additive(ringTex, "#ffffff", 0.9));
  selRing.visible = false; selRing.renderOrder = 4;
  scene.add(selRing);
  const destRing = new THREE.Sprite(additive(ringTex, "#e6ebf5", 0.7));
  destRing.visible = false; destRing.renderOrder = 4;
  scene.add(destRing);

  // Ships: a small outlined chevron that sits just above its host star on screen
  const shipTex = (() => {
    const s = 128, c = document.createElement("canvas"); c.width = c.height = s;
    const g = c.getContext("2d"); g.strokeStyle = "#fff"; g.fillStyle = "#fff"; g.lineWidth = 9; g.lineJoin = "round";
    g.beginPath(); g.moveTo(64, 14); g.lineTo(112, 104); g.lineTo(64, 80); g.lineTo(16, 104); g.closePath(); g.stroke();
    g.beginPath(); g.arc(64, 62, 9, 0, Math.PI * 2); g.fill();
    return new THREE.CanvasTexture(c);
  })();
  const ships = SHIPS.map((sh, i) => {
    const host = byName.get(sh.at);
    if (!host) { console.warn(`Ship "${sh.name}" is at unknown system "${sh.at}"`); return null; }
    const stack = SHIPS.slice(0, i).filter(o => o.at === sh.at).length;
    const sprite = new THREE.Sprite(additive(shipTex, FACTIONS.DRIFT.color, 1));
    sprite.center.set(0.5, -0.55 - stack * 1.25);   // lift above the star in screen space
    sprite.position.copy(host.v); sprite.renderOrder = 5;
    scene.add(sprite);
    return Object.assign({}, sh, { host, sprite, stack, isShip: true });
  }).filter(Boolean);
  const SHIP_PX = 11;
  const shipLiftPx = sh => 2 * SHIP_PX * (0.5 + 0.55 + sh.stack * 1.25);   // marker centre, in px above the star

  /* ---------- Connection lines ---------- */
  let lineGroup = new THREE.Group(); scene.add(lineGroup);
  let highlightGroup = new THREE.Group(); scene.add(highlightGroup);
  let mode = "adjacency";
  let origin = null;   // starting system for jump / warp / CRS views
  let dest = null;     // warp destination
  const MODE_INFO = {
    adjacency: { label: "Borders", danger: false },
    jump: { label: "Jump", range: () => TRAVEL.JUMP_RANGE, about: "CSP, Empire and Federation ships. Short, fast hops." },
    warp: { label: "Warp", route: true, about: "Conventional drive, the only one the Sisters use." },
    crs: { label: "CRS", range: () => TRAVEL.CRS_RANGE, about: "The Drift's realm-shift drive. Long range, but dangerous: heavy hull stress.", danger: true },
  };
  const isTravel = m => m !== "adjacency";
  const isRange = m => m === "jump" || m === "crs";   // modes that show everything in range of the start

  // Travel time at a constant multiple of light speed, in words
  function travelTime(ly) {
    const days = ly / TRAVEL.WARP_SPEED_C * 365.25;
    if (days < 1) return `${Math.round(days * 24)} hours`;
    if (days < 14) return `${days.toFixed(1)} days`;
    if (days < 90) return `${Math.round(days)} days (about ${Math.round(days / 7)} weeks)`;
    if (days < 730) return `${(days / 30.44).toFixed(1)} months (${Math.round(days)} days)`;

  }
  const inRange = (a, b) => dist(a, b) <= MODE_INFO[mode].range();

  const visible = s => factionOn[s.faction === "NONE" || s.status === "dead" ? "NONE" : s.faction];

  // Borders: the adjacency list. Travel modes: lines from the chosen origin to everything in range.
  function linksForMode(m) {
    if (m === "adjacency") return adjPairs.slice();
    if (!isRange(m) || !origin) return [];
    return SYSTEMS.filter(s => s !== origin && (s.name || TRAVEL.INCLUDE_FILLER) && inRange(origin, s)).map(s => [origin, s]);
  }
  function reachableFrom(s) {
    return named.filter(t => t !== s && visible(t) && inRange(s, t)).sort((a, b) => dist(s, a) - dist(s, b));
  }

  // Wireframe range bubble around the origin: one horizontal and two vertical great circles
  let rangeGroup = new THREE.Group(); scene.add(rangeGroup);
  function buildRange() {
    scene.remove(rangeGroup); rangeGroup = new THREE.Group();
    if (isRange(mode) && origin) {
      const R = MODE_INFO[mode].range(), st = modeStyle(mode), col = new THREE.Color(st.color);
      const ring = (rot) => {
        const pts = [];
        for (let i = 0; i <= 128; i++) { const a = (i / 128) * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R).applyEuler(rot).add(origin.v)); }
        const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat(col, 0.3, !!st.dashed));
        if (st.dashed) l.computeLineDistances();

  }

  function lineColor(s) { return new THREE.Color(s.status === "dead" ? "#7b8291" : FACTIONS[s.faction].color); }

  function buildLines(pairs, opts) {
    const pos = [], col = [];
    pairs.forEach(([a, b]) => {
      pos.push(a.v.x, a.v.y, a.v.z, b.v.x, b.v.y, b.v.z);

    return l;
  }

  function modeStyle(m) {
    return m === "adjacency" ? { opacity: 0.55 }
      : m === "jump" ? { opacity: 0.5, color: "#a9c6ff" }

  function rebuildLines() {
    scene.remove(lineGroup); scene.remove(highlightGroup);

    const pairs = linksForMode(mode).filter(([a, b]) => visible(a) && visible(b));
    if (pairs.length) lineGroup.add(buildLines(pairs, modeStyle(mode)));
    if (selected) {

      if (hp.length) highlightGroup.add(buildLines(hp, Object.assign({}, modeStyle(mode), { opacity: 1 })));
    }

      const solid = Math.min(d, TRAVEL.WARP_LINE_SOLID), end = Math.min(d, TRAVEL.WARP_LINE_SOLID + TRAVEL.WARP_LINE_FADE);

    else if (!origin) cap.textContent = `${info.label} from which system? Choose one above, or tap a star on the map.`;

  /* ---------- Labels ---------- */

    b.setAttribute("aria-pressed", "true");

    });
    if (pillar) pillar.visible = visible(drift);
    ships.forEach(sh => { sh.sprite.visible = factionOn.DRIFT; });

  }

  /* ---------- Panel ---------- */
  let selected = null, hovered = null;
  const panel = document.getElementById("panel");
  const pBody = document.getElementById("p-body");
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const STATUS_TEXT = { settled: "Settled", dead: "Dead", unclaimed: "Unclaimed", special: "Rogue planet" };

  function fillPanel(s) {
    const f = FACTIONS[s.faction];
    document.getElementById("p-name").textContent = s.name;
    const sw = document.getElementById("p-swatch");
    sw.style.background = s.status === "dead" ? "#8a919e" : f.color;
    sw.className = "swatch" + (s.faction === "DRIFT" ? " diamond" : "");
    document.getElementById("p-faction").textContent = s.status === "dead" ? `${f.name} (dead)` : f.name;
    const ns = neighboursOf(s).sort((a, b) => dist(s, a) - dist(s, b));
    let h = "";
    if (s.star) h += `<p class="star-line">Star: ${esc(s.star)}</p>`;
    if (s.note) h += `<p class="note">${esc(s.note)}</p>`;
    h += `<p class="meta">${STATUS_TEXT[s.status]}. Position ${s.position.x.toFixed(1)}, ${s.position.y.toFixed(1)}, ${s.position.z.toFixed(1)} ly (placeholder).</p>`;
    h += `<h3>${s.planets.length === 1 ? "Planet" : "Planets"}</h3>`;
    h += s.planets.length
      ? `<ul class="planets">${s.planets.map(p => `<li><div class="pname">${esc(p.name)}</div>${p.note ? `<div class="pnote">${esc(p.note)}</div>` : ""}</li>`).join("")}</ul>`
      : `<p class="meta" style="margin-top:0">No worlds listed.</p>`;
    const here = ships.filter(sh => sh.host === s);
    if (here.length) {
      h += `<h3>Ships here</h3><div class="neighbours ships">${here.map(sh =>
        `<button type="button" data-ship="${esc(sh.name)}"><span class="swatch diamond" style="background:${FACTIONS.DRIFT.color}"></span>${esc(sh.name)}</button>`).join("")}</div>`;
    }
    if (isRange(mode) && s === origin) {
      const reach = reachableFrom(s), info = MODE_INFO[mode];
      h += `<h3>Within ${info.label.toLowerCase() === "crs" ? "CRS" : info.label.toLowerCase()} range (${info.range()} ly)</h3>`;
      h += reach.length ? `<div class="neighbours">${reach.map(n =>
        `<button type="button" data-go="${esc(n.name)}"><span class="swatch${n.faction === "DRIFT" ? " diamond" : ""}" style="background:${n.status === "dead" ? "#8a919e" : FACTIONS[n.faction].color}"></span>${esc(n.name)} <span class="d">${dist(s, n).toFixed(1)} ly</span></button>`).join("")}</div>`
        : `<p class="meta" style="margin-top:0">Nothing in range.</p>`;
    }
    if (ns.length) {
      h += `<h3>Neighbouring systems</h3><div class="neighbours">${ns.map(n =>
        `<button type="button" data-go="${esc(n.name)}"><span class="swatch${n.faction === "DRIFT" ? " diamond" : ""}" style="background:${n.status === "dead" ? "#8a919e" : FACTIONS[n.faction].color}"></span>${esc(n.name)} <span class="d">${dist(s, n).toFixed(1)} ly</span></button>`).join("")}</div>`;
    }
    pBody.innerHTML = h;
    pBody.scrollTop = 0;
    pBody.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => select(byName.get(b.dataset.go), { fly: true })));
    pBody.querySelectorAll("[data-ship]").forEach(b => b.addEventListener("click", () => selectShip(ships.find(x => x.name === b.dataset.ship))));
  }

  function fillShipPanel(sh) {
    document.getElementById("p-name").textContent = sh.name;
    const sw = document.getElementById("p-swatch");
    sw.style.background = FACTIONS.DRIFT.color; sw.className = "swatch diamond";
    document.getElementById("p-faction").textContent = `The Drift · ${sh.kind}`;
    pBody.innerHTML = `<p class="note">${esc(sh.note)}</p>
      <h3>Current location</h3>
      <div class="neighbours"><button type="button" data-go="${esc(sh.host.name)}"><span class="swatch" style="background:${FACTIONS[sh.host.faction].color}"></span>${esc(sh.host.name)}</button></div>`;
    pBody.scrollTop = 0;
    pBody.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => select(byName.get(b.dataset.go), { fly: true })));
  }
  function selectShip(sh, opts = { fly: true }) {
    if (!sh) return;
    select(sh.host, opts);
    ships.forEach(o => o.label.classList.toggle("is-selected", o === sh));
    fillShipPanel(sh);
  }

  function select(s, opts = {}) {
    if (!s) return;
    if (!visible(s)) { // reveal a filtered faction if the user picked it from search
      const k = s.faction === "NONE" || s.status === "dead" ? "NONE" : s.faction;
      factionOn[k] = true;
      filterEl.children[["CSP", "SIS", "EMP", "FED", "DRIFT", "NONE"].indexOf(k)].setAttribute("aria-pressed", "true");
      applyVisibility();
    }
    if (selected) selected.label.classList.remove("is-selected");
    ships.forEach(o => o.label.classList.remove("is-selected"));
    selected = s;
    s.label.classList.add("is-selected");
    if (isRange(mode) && !opts.keepOrigin) setOrigin(s, false);
    if (mode === "warp" && !opts.keepOrigin) {
      if (!origin) setOrigin(s, false);
      else if (s !== origin) setDest(s, false);
    }
    selRing.material.color.set(s.status === "dead" ? "#aeb4bf" : FACTIONS[s.faction].color);
    selRing.position.copy(s.v);
    selRing.visible = true;
    fillPanel(s);
    panel.hidden = false;
    rebuildLines();
    if (opts.fly) flyTo(s.v, opts.zoom);
  }
  function closePanel() {
    if (selected) selected.label.classList.remove("is-selected");
    selected = null; selRing.visible = false; panel.hidden = true; rebuildLines();
  }
  document.getElementById("p-close").addEventListener("click", closePanel);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && document.activeElement !== qInput) closePanel(); });

  /* ---------- Camera motion ---------- */
  let fly = null;
  function flyTo(target, zoom) {
    const offset = camera.position.clone().sub(controls.target);
    if (zoom) offset.setLength(zoom);
    const endTarget = target.clone(), endPos = target.clone().add(offset);
    if (reduceMotion) { controls.target.copy(endTarget); camera.position.copy(endPos); return; }
    fly = { t0: performance.now(), dur: 650, fromT: controls.target.clone(), fromP: camera.position.clone(), toT: endTarget, toP: endPos };
  }
  const HOME_TARGET = new THREE.Vector3(0, 0, 0.3);
  function homeView(instant) {
    // Fit a ~7 ly radius into whichever viewport side is narrower
    // Portrait screens look down from the CSP side so the long Empire–CSP axis runs top to bottom.
    const portrait = camera.aspect < 0.8;
    const R = portrait ? 15 : 17.5, vfov = THREE.MathUtils.degToRad(camera.fov);
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
    const d = R / Math.sin(Math.min(vfov, hfov) / 2);
    const dir = (portrait ? new THREE.Vector3(0.62, 1.5, 0) : new THREE.Vector3(0, 0.62, 1)).normalize();
    const pos = HOME_TARGET.clone().add(dir.multiplyScalar(d));
    if (instant || reduceMotion) { controls.target.copy(HOME_TARGET); camera.position.copy(pos); fly = null; return; }
    fly = { t0: performance.now(), dur: 700, fromT: controls.target.clone(), fromP: camera.position.clone(), toT: HOME_TARGET.clone(), toP: pos };
  }
  document.getElementById("reset").addEventListener("click", () => homeView(false));
  controls.addEventListener("start", () => { fly = null; });

  /* ---------- Picking (tap / click / hover) ---------- */
  const tmp = new THREE.Vector3();
  function screenOf(v) {
    tmp.copy(v).project(camera);
    return { x: (tmp.x + 1) / 2 * W, y: (1 - tmp.y) / 2 * H, behind: tmp.z > 1 };
  }
  function pick(x, y, radius) {
    let best = null, bd = radius;
    ships.forEach(sh => {
      if (!factionOn.DRIFT) return;
      const p = screenOf(sh.host.v); if (p.behind) return;
      const d = Math.hypot(p.x - x, p.y - shipLiftPx(sh) - y) - 4;   // small bias so the marker wins over its star
      if (d < bd) { bd = d; best = sh; }
    });
    named.forEach(s => {
      if (!visible(s)) return;
      const p = screenOf(s.v); if (p.behind) return;
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < bd) { bd = d; best = s; }
    });
    return best;
  }
  let down = null;
  canvas.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener("pointerup", e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    if (moved < 7 && performance.now() - down.t < 500) {
      const s = pick(e.clientX, e.clientY, e.pointerType === "touch" ? 30 : 18);
      if (s && s.isShip) selectShip(s); else if (s) select(s, { fly: true }); else if (selected) closePanel();
    }
    down = null;
  });
  canvas.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse" || e.buttons) return;
    hovered = pick(e.clientX, e.clientY, 16);
    canvas.style.cursor = hovered ? "pointer" : "";
  });

  /* ---------- Search ---------- */
  const qInput = document.getElementById("q");
  const results = document.getElementById("results");
  let hits = [], active = 0;
  const norm = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  function runSearch() {
    const q = norm(qInput.value.trim());
    if (!q) { results.hidden = true; qInput.setAttribute("aria-expanded", "false"); return; }
    hits = [];
    named.forEach(s => { if (norm(s.name).includes(q)) hits.push({ s, sub: FACTIONS[s.faction].short, rank: norm(s.name).startsWith(q) ? 0 : 1 }); });
    ships.forEach(sh => { if (norm(sh.name).includes(q)) hits.push({ s: sh.host, ship: sh, label: sh.name, sub: `at ${sh.host.name}`, rank: 0 }); });
    named.forEach(s => s.planets.forEach(p => {
      if (p.name !== s.name && norm(p.name).includes(q)) hits.push({ s, label: p.name, sub: `in ${s.name}`, rank: 2 });
    }));
    hits.sort((a, b) => a.rank - b.rank).splice(7);
    active = 0;
    results.innerHTML = hits.length
      ? hits.map((h, i) => `<li role="option" aria-selected="${i === 0}"><button type="button" tabindex="-1" data-i="${i}" class="${i === 0 ? "is-active" : ""}"><span class="swatch${h.ship || h.s.faction === "DRIFT" ? " diamond" : ""}" style="background:${h.ship ? FACTIONS.DRIFT.color : h.s.status === "dead" ? "#8a919e" : FACTIONS[h.s.faction].color}"></span><span>${esc(h.label || h.s.name)}</span><span class="sub">${esc(h.sub)}</span></button></li>`).join("")
      : `<li class="empty">No system or planet matches \u201c${esc(qInput.value.trim())}\u201d.</li>`;
    results.hidden = false; qInput.setAttribute("aria-expanded", "true");
    results.querySelectorAll("button").forEach(b => b.addEventListener("click", () => choose(+b.dataset.i)));
  }
  function choose(i) {
    const h = hits[i]; if (!h) return;
    if (h.ship) selectShip(h.ship, { fly: true, zoom: 16 }); else select(h.s, { fly: true, zoom: 16 });
    qInput.value = ""; results.hidden = true; qInput.setAttribute("aria-expanded", "false");
    qInput.blur();
  }
  function setActive(i) {
    const btns = results.querySelectorAll("button"); if (!btns.length) return;
    active = (i + btns.length) % btns.length;
    btns.forEach((b, k) => { b.classList.toggle("is-active", k === active); b.parentElement.setAttribute("aria-selected", String(k === active)); });
  }
  qInput.addEventListener("input", runSearch);
  qInput.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); setActive(active + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
    else if (e.key === "Enter") { e.preventDefault(); choose(active); }
    else if (e.key === "Escape") { qInput.value = ""; runSearch(); }
  });

  /* ---------- Travel mode toggle ---------- */
  const originSel = document.getElementById("origin"), destSel = document.getElementById("dest");
  [originSel, destSel].forEach(sel => {
    [["FED", "Federation"], ["DRIFT", "The Drift"], ["CSP", "CSP"], ["SIS", "Three Sisters"], ["EMP", "Empire"], ["DEAD", "Dead systems"]].forEach(([k, label]) => {
      const list = named.filter(s => k === "DEAD" ? s.status === "dead" : s.faction === k && s.status !== "dead");
      if (!list.length) return;
      const g = document.createElement("optgroup"); g.label = label;
      list.forEach(s => { const o = document.createElement("option"); o.value = s.name; o.textContent = s.name; g.appendChild(o); });
      sel.appendChild(g);
    });
  });
  function setOrigin(s, refresh = true) {
    origin = s || null;
    if (origin && origin === dest) { dest = null; destSel.value = ""; }
    originSel.value = origin ? origin.name : "";
    if (refresh) { rebuildLines(); if (selected) fillPanel(selected); }
  }
  function setDest(s, refresh = true) {
    dest = s && s !== origin ? s : null;
    destSel.value = dest ? dest.name : "";
    if (refresh) rebuildLines();
  }
  originSel.addEventListener("change", () => {
    const s = byName.get(originSel.value);
    setOrigin(s);
    if (s) select(s, { fly: true, keepOrigin: true });
  });
  destSel.addEventListener("change", () => setDest(byName.get(destSel.value)));
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    document.querySelectorAll(".seg button").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
    if (isTravel(mode) && !origin && selected) origin = selected;   // start from the open system if there is one
    originSel.value = origin ? origin.name : "";
    destSel.value = dest ? dest.name : "";
    rebuildLines();
    if (selected) fillPanel(selected);
    if (window.innerWidth > 720) {
      if (isTravel(mode) && !origin) originSel.focus();
      else if (mode === "warp" && !dest) destSel.focus();
    }
  }));

  /* ---------- Resize ---------- */
  let W = 1, H = 1;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    renderer.setSize(W, H, false);
    camera.aspect = W / H; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();
  homeView(true);

  /* ---------- Scale bar ---------- */
  const scaleBar = document.getElementById("scale-bar"), scaleText = document.getElementById("scale-text");
  let lastScale = "";
  function updateScale() {
    const d = camera.position.distanceTo(controls.target);
    const pxPerLy = H / (2 * d * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
    const nice = [0.25, 0.5, 1, 2, 3, 5, 10, 20, 50];
    let ly = nice[0];
    for (const n of nice) { if (n * pxPerLy <= 140) ly = n; }
    const w = Math.round(ly * pxPerLy);
    const key = ly + ":" + w;
    if (key !== lastScale) {
      lastScale = key;
      scaleBar.style.width = w + "px";
      scaleText.textContent = `${ly} light year${ly === 1 ? "" : "s"}`;
    }
    return pxPerLy;
  }

  /* ---------- Label placement with collision culling ---------- */
  function placeLabels() {
    const items = [];
    named.forEach(s => {
      if (!visible(s)) { s.label.classList.add("is-hidden"); return; }
      const p = screenOf(s.v);
      if (p.behind || p.x < -40 || p.x > W + 40 || p.y < -20 || p.y > H + 20) { s.label.classList.add("is-hidden"); return; }
      const camD = camera.position.distanceTo(s.v);
      const pri = (s === selected ? 1000 : 0) + (s === hovered ? 900 : 0) + (s.status === "special" ? 300 : 0)
        + (s.capital ? 200 : 0) + (s.status === "dead" && !s.capital ? 40 : 100) - camD * 0.3;
      items.push({ s, p, pri });
    });
    const placed = [];
    ships.forEach(sh => {
      const sp = screenOf(sh.host.v);
      if (!factionOn.DRIFT || sp.behind) { sh.label.classList.add("is-hidden"); return; }
      const p = { x: sp.x, y: sp.y - shipLiftPx(sh) };
      placed.push({ x: p.x - SHIP_PX * 0.6, y: p.y - SHIP_PX * 0.6, w: SHIP_PX * 1.2, h: SHIP_PX * 1.2 });   // keep names off the marker
      items.push({ s: sh, p: { x: p.x + 6, y: p.y }, pri: (sh.label.classList.contains("is-selected") ? 1100 : 0) + (sh === hovered ? 900 : 0) + 180 });
    });
    items.sort((a, b) => b.pri - a.pri);
    const off = 10;
    items.forEach(({ s, p }) => {
      // Try the right of the star first, then the left.
      const pad = 3;
      const collides = r => r.x < 2 || r.x + r.w > W - 2 || placed.some(q => r.x < q.x + q.w + pad && r.x + r.w + pad > q.x && r.y < q.y + q.h + pad && r.y + r.h + pad > q.y);
      // Candidate spots: right, left, then just above or below on the right.
      const cy = p.y - s.lh / 2;
      const spots = [[p.x + off, cy], [p.x - off - s.lw, cy], [p.x + off - 4, cy - s.lh + 2], [p.x + off - 4, cy + s.lh - 2]]
        .map(([x, y]) => ({ x, y, w: s.lw, h: s.lh }));
      let r = spots.find(c => !collides(c));
      if (!r) {
        if (s !== selected && s !== hovered) { s.label.classList.add("is-hidden"); return; }
        r = spots[0];   // selected or hovered always shows
      }
      placed.push(r);
      s.label.classList.remove("is-hidden");
      s.label.style.transform = `translate3d(${r.x.toFixed(1)}px, ${r.y.toFixed(1)}px, 0)`;
    });

    // Region names: centred on their anchor, nudged inside the screen, hidden if they would cover a star name.
    regionLabels.forEach(rl => {
      if (!factionOn[rl.key]) { rl.el.classList.add("is-hidden"); return; }
      const p = screenOf(rl.v);
      if (p.behind) { rl.el.classList.add("is-hidden"); return; }
      const w = rl.w, h = rl.h, m = 8;
      const clampR = (dx, dy) => ({ x: Math.min(Math.max(p.x - w / 2 + dx, m), W - w - m), y: Math.min(Math.max(p.y - h / 2 + dy, m), H - h - m), w, h });
      const tries = [[0, 0], [0, -h - 6], [0, h + 6], [-w / 2, 0], [w / 2, 0], [0, -2 * h - 10], [0, 2 * h + 10]].map(([dx, dy]) => clampR(dx, dy));
      const r = tries.find(t => !placed.some(q => t.x < q.x + q.w + 4 && t.x + t.w + 4 > q.x && t.y < q.y + q.h + 2 && t.y + t.h + 2 > q.y));
      if (!r) { rl.el.classList.add("is-hidden"); return; }
      const x = r.x, y = r.y;
      placed.push(r);
      rl.el.classList.remove("is-hidden");
      rl.el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
    });
  }

  /* ---------- Frame loop ---------- */
  const viewOff = { x: 0, y: 0 };
  const ease = t => 1 - Math.pow(1 - t, 3);
  function frame(now) {
    if (fly) {
      const t = Math.min(1, (now - fly.t0) / fly.dur), k = ease(t);
      controls.target.lerpVectors(fly.fromT, fly.toT, k);
      camera.position.lerpVectors(fly.fromP, fly.toP, k);
      if (t >= 1) fly = null;
    }
    controls.update();

    // Keep the focus point clear of the open panel (right side on wide screens, bottom sheet on narrow ones)
    let wantX = 0, wantY = 0;
    if (!panel.hidden) {
      if (W <= 720) wantY = panel.offsetHeight / 2;
      else wantX = (panel.offsetWidth + 14) / 2;
    }
    const k2 = reduceMotion ? 1 : 0.12;
    viewOff.x += (wantX - viewOff.x) * k2; viewOff.y += (wantY - viewOff.y) * k2;
    if (Math.abs(viewOff.x - wantX) < 0.5) viewOff.x = wantX;
    if (Math.abs(viewOff.y - wantY) < 0.5) viewOff.y = wantY;
    if (viewOff.x || viewOff.y) camera.setViewOffset(W, H, viewOff.x, viewOff.y, W, H);
    else camera.clearViewOffset();

    // Constant on-screen star size
    const worldPerPx = (d) => (2 * d * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)) / H;
    SYSTEMS.forEach(s => {
      const d = camera.position.distanceTo(s.v);
      const boost = s === hovered ? 1.35 : 1;
      s.dot.scale.setScalar(worldPerPx(d) * s.px * 2.2 * boost);
    });
    ships.forEach(sh => {
      const d = camera.position.distanceTo(sh.host.v);
      sh.sprite.scale.setScalar(worldPerPx(d) * SHIP_PX * 2 * (sh === hovered ? 1.25 : 1));
    });
    if (destRing.visible) destRing.scale.setScalar(worldPerPx(camera.position.distanceTo(destRing.position)) * 24);
    if (selected) {
      const d = camera.position.distanceTo(selected.v);
      const pulse = reduceMotion ? 1 : 1 + 0.06 * Math.sin(now / 420);
      selRing.scale.setScalar(worldPerPx(d) * 28 * pulse);
    }
    const az = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
    flatTexts.forEach(m => {
      if (!m.userData.upright) { m.rotation.set(-Math.PI / 2, az, 0); return; }
      m.quaternion.copy(camera.quaternion);
      const h = worldPerPx(camera.position.distanceTo(m.position)) * m.userData.pxH;
      m.scale.set(h * m.userData.aspect, h, 1);
    });
    ringLabels.forEach(({ r, mesh }) => {
      mesh.position.set(Math.sin(az + 0.32) * r, 0, Math.cos(az + 0.32) * r);
      if (!mesh.userData.baseH) mesh.userData.baseH = mesh.scale.y;
      const h = Math.min(mesh.userData.baseH, worldPerPx(camera.position.distanceTo(mesh.position)) * 22);
      mesh.scale.set(h * mesh.userData.aspect, h, 1);
    });
    if (pillar) {
      const base = drift.v;
      const d = camera.position.distanceTo(base);
      pillar.scale.set(Math.max(0.05, worldPerPx(d) * 6), PILLAR_HEIGHT, 1);
      pillar.position.set(base.x, base.y + PILLAR_HEIGHT / 2, base.z);
      pillar.rotation.y = Math.atan2(camera.position.x - base.x, camera.position.z - base.z);
    }

    updateScale();
    renderer.render(scene, camera);
    placeLabels();
    requestAnimationFrame(frame);
  }

  applyVisibility();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
